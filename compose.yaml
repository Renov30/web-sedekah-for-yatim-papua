services:
  # Next.js Web App
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: web-sfy:latest
    container_name: web-sfy-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://sfy_admin:sfy_papua_amanah_2026@postgres:5432/sfy_database?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Database Engine: PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: web-sfy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sfy_admin
      POSTGRES_PASSWORD: sfy_papua_amanah_2026
      POSTGRES_DB: sfy_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfy_admin -d sfy_database"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
