services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: web-sfy-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

